# Blueprint de Render: API Express + PostgreSQL (planes gratuitos).
# En el plan gratuito no hay preDeployCommand, por eso las migraciones
# se ejecutan como primer paso del startCommand.
services:
  - type: web
    name: cultura-ciudadana-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm run migrar && npm start
    healthCheckPath: /api/v1/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cultura-ciudadana-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false # URL del frontend en Vercel; se define en el panel de Render
      - key: QR_JWT_SECRETO
        generateValue: true # Render genera un secreto aleatorio para firmar los QR
      - key: FIREBASE_STORAGE_BUCKET
        value: plataforma-cultura-ciudadana.firebasestorage.app # fotos de evidencia (Fase 7)

databases:
  - name: cultura-ciudadana-db
    plan: free
    databaseName: cultura_ciudadana
